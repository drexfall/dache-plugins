name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, so an older run can't overwrite a newer index.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check.sh "$(scripts/fetch-cli.sh)"
      - name: Sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DACHE_INDEX_KEY: ${{ secrets.DACHE_INDEX_KEY }}
        run: scripts/publish.sh "$(scripts/fetch-cli.sh)"
